[pytest]
minversion = 7.0
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --junit-xml=reports/junit/results.xml
    --allure-dir=reports/allure-results
testpaths = tests
markers =
    smoke: smoke test markers
    regression: regression test markers
    framework: framework test markers
    slow: marks tests as slow
    skip: skip test
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
